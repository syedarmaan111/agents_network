
services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-agents_network}
      POSTGRES_USER: ${APP_POSTGRES_USER:-agents_network}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${APP_POSTGRES_DB:-agents_network}
      POSTGRES_USER: ${APP_POSTGRES_USER:-agents_network}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in .env}
      APP_DATABASE_URL: postgresql+psycopg://${APP_POSTGRES_USER:-agents_network}:${APP_POSTGRES_PASSWORD:?Set APP_POSTGRES_PASSWORD in .env}@database:5432/${APP_POSTGRES_DB:-agents_network}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:?Set APP_JWT_SECRET_KEY in .env}
      APP_GROQ_API_KEY: ${APP_GROQ_API_KEY:-}
      APP_GROQ_MODEL: ${APP_GROQ_MODEL:-openai/gpt-oss-20b}
      APP_TAVILY_API_KEY: ${APP_TAVILY_API_KEY:-}
      APP_CORS_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
